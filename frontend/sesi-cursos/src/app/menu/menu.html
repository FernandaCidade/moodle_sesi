<mat-toolbar [class.scrolled]="isScrolled" [class.menu-curso]="paginaCurso()" class="fixed-menu">
    <mat-toolbar-row>
        <a routerLink="/" class="logo-container">
            <img [src]="logoAtual" alt="Logo SESI" class="logo-img">
        </a>
        <span class="example-spacer"></span>
        <span><a routerLink="/">Início</a></span>
        <span><a routerLink="/cursos">Cursos</a></span>
        <span><a routerLink="/" fragment="secao-sobre">Sobre</a></span>

        <span id="area-aluno"><a routerLink="/area-aluno">Área do aluno</a></span>
    </mat-toolbar-row>
</mat-toolbar>
